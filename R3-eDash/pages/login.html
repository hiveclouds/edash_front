<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>360eDash — Login</title>

<!-- Google Fonts: Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- Login page style -->
<link rel="stylesheet" href="../css/login.css">
<link rel="stylesheet" href="../css/dark-mode-v8.css">
</head>
<body>

<div class="login-shell">

  <!-- Left: brand / image panel — background.png fills almost half the
       viewport, rounded only on the inner edge, logo2 top-left, tagline bottom-left -->
  <div class="login-visual" style="background-image:url('../assets/background.png');">
    <img class="login-visual__logo-img" src="../assets/logo2.png" alt="360energy">
    <p class="login-visual__tagline">Power your business.<br>Go solar.</p>
  </div>

  <!-- Right: login form -->
  <div class="login-form-panel">

    <div class="login-form-wrap">

      <a href="#" id="loginBackLink" class="login-back-link"><i class="fa-solid fa-arrow-left"></i> Back</a>

      <div class="login-form-head">
        <h1>Sign in to your account</h1>
        <p>Access your project monitoring, tasks, and reports anytime, anywhere.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>

        <div class="form-group">
          <label for="loginUsername">Username</label>
          <div class="input-control">
            <i class="fa-regular fa-user input-control__icon"></i>
            <input
              type="text"
              id="loginUsername"
              name="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
          </div>
          <span class="form-error" id="usernameError"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <div class="input-control">
            <i class="fa-solid fa-lock input-control__icon"></i>
            <input
              type="password"
              id="loginPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="input-control__toggle" id="togglePassword" aria-label="Show password">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
          <span class="form-error" id="passwordError"></span>
        </div>

        <span class="form-error form-error--general" id="loginError"></span>

        <button type="submit" class="btn-login" id="loginSubmit">
          <span class="btn-login__label">Login</span>
        </button>

      </form>

      <p class="login-footnote">
        Account access is managed by your administrator. Contact your admin if you have trouble logging in.
      </p>

    </div>

  </div>

</div>

<script src="../js/api-config.js"></script>
<script src="../js/activity-log-client.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
