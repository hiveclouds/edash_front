<!-- =========================================================
     Auth Guard — HARUS paling atas & TIDAK pakai "defer".
     Dijalankan sebelum apa pun lain di-load, supaya kalau user
     belum login, dia langsung dilempar ke halaman login tanpa
     sempat melihat isi dashboard (menghindari "flash" konten). -->
<script>
  (function () {
    var isLoggedIn = sessionStorage.getItem("edash-user");
    if (!isLoggedIn) {
      // Ticket deep-link (?ticket=<id>, lihat js/ticketing.js & tombol
      // "Copy Link" di modal detail ticket): kalau user belum login,
      // simpan dulu ke sessionStorage SEBELUM dilempar ke halaman
      // marketing, supaya tidak hilang. login.js membacanya lagi
      // lewat "edash-pending-deeplink" dan mengarahkan balik ke sini
      // (lengkap dengan ?ticket=...) begitu login berhasil.
      var ticketParam = new URLSearchParams(window.location.search).get("ticket");
      if (ticketParam) {
        sessionStorage.setItem("edash-pending-deeplink", "index.html?ticket=" + encodeURIComponent(ticketParam));
      }
      window.location.replace("main-page/index.html");
    }
  })();
</script>

<style>
  :root {
    --page-bg: #f4f7f7;

    /* Tracks .edash-content's own padding at each breakpoint below, so
       any page that needs to break out of that padding (e.g. Project
       Selector's fullscreen map) can use `inset: calc(-1 * var(...))`
       instead of a hardcoded value that drifts out of sync with the
       responsive padding and clips content under the header. */
    --edash-content-pad: 24px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--page-bg);
    color: #25343F;
  }

  html[data-theme="dark"] body {
    background: #101b1f;
    color: #e7eff0;
  }

  html[data-theme="dark"] .edash-content {
    background: #101b1f;
  }

  html[data-theme="dark"] * {
    scrollbar-color: #315158 transparent;
  }

  html[data-theme="dark"] *::-webkit-scrollbar-thumb {
    background-color: #315158;
  }

  html[data-theme="dark"] *::-webkit-scrollbar-thumb:hover {
    background-color: #21a7ae;
  }

  /* ---------- App shell ----------
     Hanya .edash-content yang scroll. Sidebar & header punya tinggi
     tetap (100vh) sehingga header TIDAK PERNAH ikut ter-scroll,
     tidak akan "tenggelam" walau isi halaman panjang. */

  .edash-layout {
    display: flex;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    max-width: 100vw;
  }

  .edash-main {
    flex: 1;
    min-width: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .edash-content {
    position: relative;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: var(--edash-content-pad);
    -webkit-overflow-scrolling: touch;
  }

  #sidebar-root:empty,
  #header-root:empty {
    display: none;
  }

  /* ---------- Responsive content padding ----------
     Keeps the same layout concept, just tightens the outer gutter
     as the viewport shrinks so cards/tables have more usable width. */

  @media (max-width: 1024px) {
    .edash-content {
      padding: 20px;
    }

    :root {
      --edash-content-pad: 20px;
    }
  }

  @media (max-width: 640px) {
    .edash-content {
      padding: 16px;
    }

    :root {
      --edash-content-pad: 16px;
    }
  }

  @media (max-width: 400px) {
    .edash-content {
      padding: 12px;
    }

    :root {
      --edash-content-pad: 12px;
    }
  }

  /* Fullscreen pages (e.g. Project Selector map) opt out of the
     dvh fallback issue by keeping fixed 100vh already handled above. */

  /* ---------- Global thin scrollbar ----------
     Applies to any scrollable region in the app (content area,
     modals, tables, etc.) so scrollbars look consistent everywhere
     instead of the bulky OS default. */

  * {
    scrollbar-width: thin;
    scrollbar-color: #cfe4e4 transparent;
  }

  *::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  *::-webkit-scrollbar-track {
    background: transparent;
  }

  *::-webkit-scrollbar-thumb {
    background-color: #cfe4e4;
    border-radius: 999px;
  }

  *::-webkit-scrollbar-thumb:hover {
    background-color: #0f6a71;
  }
</style>
